[project]
name = "lvec"
version = "0.3.5"
description = "Lorentz and spatial vectors for particle physics with NumPy and Awkward Array"
dynamic = ["readme"]
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mohamed Elashri", email = "lvec@elashri.com" }
]
keywords = ["physics", "lorentz", "vector", "numpy", "awkward"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.2.4",
]

[project.optional-dependencies]
awkward = ["awkward>=2.7.4"]
test = ["pytest>=8.3.5"]
examples = ["awkward>=2.7.4", "uproot>=5.0.0", "matplotlib>=3.10.1"]
benchmark = ["awkward>=2.7.4", "vector>=1.6.1"]
docs = ["sphinx>=8.1,<9", "myst-parser>=4,<5", "furo>=2024.8.6"]
dev = ["lvec[awkward,test,examples,benchmark]"]

[project.urls]
Homepage = "https://github.com/MohamedElashri/lvec"
Documentation = "https://melashri.net/lvec/"
Repository = "https://github.com/MohamedElashri/lvec"
Issues = "https://github.com/MohamedElashri/lvec/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["lvec/tests", "benchmarks/tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["lvec"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["lvec[dev]"]
