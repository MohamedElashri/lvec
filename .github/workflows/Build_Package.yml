name: lvec CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  actions-lock:
    name: Check action lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - name: Verify action dependencies
        uses: MohamedElashri/sanad@v1.0.1
        with:
          mode: check
          base: ${{ github.event.pull_request.base.sha }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            dependencies: minimum
          - python: "3.11"
            dependencies: current
          - python: "3.12"
            dependencies: current
          - python: "3.13"
            dependencies: current
          - python: "3.14"
            dependencies: current
          - python: "3.15"
            dependencies: current
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install current dependencies
        if: matrix.dependencies == 'current'
        run: python -m pip install -e ".[awkward,test]"
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -e ".[awkward,test]" -c requirements.txt
      - name: Install independent physics reference
        if: matrix.python == '3.13'
        run: python -m pip install "vector>=1.6.1"
      - run: python -m pytest -W error::RuntimeWarning

  numpy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - name: Verify optional backend is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('awkward') is None"
      - run: python -m pytest -W error::RuntimeWarning

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install ".[examples]"
      - run: python .github/scripts/check_examples.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install build "twine>=7" pypi-attestations
      - name: Verify publishing CLI entry points
        run: |
          python -m pypi_attestations sign --help > /dev/null
          python -m twine upload --help > /dev/null
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PYCODE'
          import importlib.metadata
          import re
          import lvec
          from lvec import LVec

          assert importlib.metadata.version("lvec") == lvec.__version__
          assert lvec.get_invariant_policy() == 'fast'
          with lvec.invariant_policy('accurate'):
              assert LVec(1e200, 1., 0., 1e200).mass2 == -1.
          description = importlib.metadata.metadata("lvec").get_payload()
          for target in re.findall(r"\]\(([^\s)]+)\)", description):
              assert target.startswith(("https://", "http://", "#")), target
          PYCODE
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
