name: lvec CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            dependencies: minimum
          - python: "3.11"
            dependencies: current
          - python: "3.12"
            dependencies: current
          - python: "3.13"
            dependencies: current
          - python: "3.14"
            dependencies: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current dependencies
        if: matrix.dependencies == 'current'
        run: python -m pip install -e ".[awkward,test]"
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -e ".[awkward,test]" -c requirements.txt
      - name: Install independent physics reference
        if: matrix.python == '3.13'
        run: python -m pip install "vector>=1.6.1"
      - run: python -m pytest

  numpy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - name: Verify optional backend is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('awkward') is None"
      - run: python -m pytest

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
