name: Documentation

on:
  pull_request:
    paths: ['docs/**', '**/*.md', 'pyproject.toml', 'lvec/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', '**/*.md', 'pyproject.toml', 'lvec/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[docs,awkward]"
      - name: Build manual and verify examples
        env:
          DOCS_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m sphinx -b html -n -W --keep-going docs docs/_build/html
          python -m sphinx -b doctest -W --keep-going docs docs/_build/doctest
          python docs/check.py docs/_build/html
      - uses: actions/upload-pages-artifact@v5.0.0
        if: matrix.python == '3.13'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
