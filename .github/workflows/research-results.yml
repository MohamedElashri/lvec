name: Retrieve completed native research results
on:
  push:
    branches: [study/complete-research]
    paths: [.github/workflows/research-results.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency: research-result-relay
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Relay existing observations through an unpublished release
        shell: bash
        run: |
          set -euo pipefail
          tag=research-output-v032-20261104
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          for host in aarch64-linux x86_64-linux; do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41824431817/artifacts" --jq ".artifacts[] | select(.name == \"v032-rerun-${host}\") | .id")
            if [ -z "$artifact" ]; then
              echo "$host has no completed artifact yet"
              continue
            fi
            destination="$RUNNER_TEMP/$host"
            gh run download 41824431817 --repo "$GITHUB_REPOSITORY" --name "v032-rerun-$host" --dir "$destination"
            test "$(cat "$destination/$host/COMPLETE")" = 'Library SHA256: e5c523e0bf2766d13398e596cb985c9065dacb18181cf8a6c4d546d6ad1e6174'
            python - "$destination" <<'PY'
          from pathlib import Path
          import sys
          forbidden={'.root','.npz','.json'}
          assert not any(p.suffix in forbidden for p in Path(sys.argv[1]).rglob('*') if p.is_file())
          PY
            tar -czf "$RUNNER_TEMP/$host.tar.gz" -C "$destination" "$host"
            (cd "$RUNNER_TEMP" && sha256sum "$host.tar.gz" > "$host.tar.gz.sha256")
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$host.tar.gz" "$RUNNER_TEMP/$host.tar.gz.sha256" --clobber
            echo "Relayed $host from existing artifact $artifact"
          done
